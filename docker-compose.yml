# Reusable vars
x-var:
  - &POSTGRES_USER postgres
  - &POSTGRES_PASSWORD default
  - &POSTGRES_DATABASE postgres
  - &node-image node:22

# Reusable envars for postgres
x-postgres-vars: &postgres-vars
  POSTGRES_HOST: database
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  POSTGRES_DATABASE: *POSTGRES_DATABASE
  POSTGRES_SCHEMA: address_change

services:
  database:
    image: postgres:18.6
    container_name: database
    environment:
      <<: *postgres-vars
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
    ports: ["5432:5432"]

  migrations:
    build: ./migrations
    container_name: migrations
    command: info migrate info
    volumes: ["./migrations/sql:/flyway/sql:ro", "./migrations/seed:/flyway/seed:ro"]
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres
      FLYWAY_USER: *POSTGRES_USER
      FLYWAY_PASSWORD: *POSTGRES_PASSWORD
      FLYWAY_DEFAULT_SCHEMA: address_change
      # Seed folder is local-only; the migrations image copies sql/ alone.
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
    depends_on:
      database:
        condition: service_healthy

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    profiles: ["schemaspy"]
    container_name: schemaspy
    command: -t pgsql11 -db postgres -host database -port 5432 -u postgres -p default -schemas address_change
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes: ["./output:/output"]

  # Local-only partner SFTP endpoint; users mirror the seeded partner_system usernames.
  sftp:
    image: atmoz/sftp:alpine
    profiles: ["sftp"]
    container_name: sftp
    command: sample-icbc:localpass:1001::inbound sample-health:localpass:1002::inbound
    ports: ["2222:22"]

  backend:
    container_name: backend
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: sh -c "npm i && npx prisma generate && npx swc generated/prisma -d generated --strip-leading-paths -C module.type=commonjs && npm run start:dev"
    environment:
      <<: *postgres-vars
      NODE_ENV: development
    image: *node-image
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
    working_dir: "/app"
    volumes: ["./backend:/app", "/app/node_modules"]

  frontend:
    container_name: frontend
    entrypoint: sh -c "npm ci --ignore-scripts && npm run dev"
    environment:
      BACKEND_URL: http://backend:3000
      PORT: 3000
      NODE_ENV: development
    image: *node-image
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    working_dir: "/app"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    container_name: caddy
    profiles: ["caddy"]
    build: ./frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_URL: http://backend:3000
      LOG_LEVEL: info
    ports: ["3005:3000"]
    volumes: ["./frontend/Caddyfile:/etc/caddy/Caddyfile"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    depends_on:
      backend:
        condition: service_healthy
