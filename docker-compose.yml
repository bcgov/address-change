# Reusable vars
x-var:
  - &POSTGRES_USER postgres
  - &POSTGRES_PASSWORD default
  - &POSTGRES_DATABASE postgres
  - &node-image node:22

# Reusable envars for postgres
x-postgres-vars: &postgres-vars
  POSTGRES_HOST: database
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  POSTGRES_DATABASE: *POSTGRES_DATABASE
  POSTGRES_SCHEMA: address_change

services:
  database:
    image: postgres:18.6
    container_name: database
    environment:
      <<: *postgres-vars
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
    ports: ["5432:5432"]

  migrations:
    build: ./migrations
    container_name: migrations
    command: info migrate info
    volumes: ["./migrations/sql:/flyway/sql:ro"]
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres
      FLYWAY_USER: *POSTGRES_USER
      FLYWAY_PASSWORD: *POSTGRES_PASSWORD
      FLYWAY_DEFAULT_SCHEMA: address_change
    depends_on:
      database:
        condition: service_healthy

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    profiles: ["schemaspy"]
    container_name: schemaspy
    command: -t pgsql11 -db postgres -host database -port 5432 -u postgres -p default -schemas address_change
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes: ["./output:/output"]

  backend:
    container_name: backend
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: sh -c "npm i && npx prisma generate && npx swc generated/prisma -d generated --strip-leading-paths -C module.type=commonjs && npm run start:dev"
    environment:
      <<: *postgres-vars
      NODE_ENV: development
      OIDC_ISSUER: ${OIDC_ISSUER:-https://dev.loginproxy.gov.bc.ca/auth/realms/standard}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-address-change-bc-6667}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs}
      OIDC_SUBMISSION_SCOPE: ${OIDC_SUBMISSION_SCOPE:-address-change-bc-6667}
      ADDRESS_CHANGE_ENCRYPTION_KEY_ID: local-v1
      # Throwaway key for the local database only; override with LOCAL_ENCRYPTION_KEY.
      ADDRESS_CHANGE_ENCRYPTION_KEYS: '{"local-v1":"${LOCAL_ENCRYPTION_KEY:-sBdUoJ4xi4yk3S3zX/RwPR3DdbXhDeVLx+IbO+/mKmI=}"}'
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    image: *node-image
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
    working_dir: "/app"
    volumes: ["./backend:/app", "/app/node_modules"]

  frontend:
    container_name: frontend
    entrypoint: sh -c "npm ci --ignore-scripts && npm run dev"
    environment:
      BACKEND_URL: http://backend:3000
      PORT: 3000
      NODE_ENV: development
      USE_POLLING: "true"
      VITE_OIDC_SCOPE: openid profile email ${OIDC_SUBMISSION_SCOPE:-address-change-bc-6667}
    image: *node-image
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    working_dir: "/app"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    container_name: caddy
    profiles: ["caddy"]
    build: ./frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_URL: http://backend:3000
      LOG_LEVEL: info
    ports: ["3005:3000"]
    volumes: ["./frontend/Caddyfile:/etc/caddy/Caddyfile"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    depends_on:
      backend:
        condition: service_healthy
