apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.gold.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "2"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "100m"
  - name: MEMORY_REQUEST
    value: "128Mi"
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: "4Gi"
  - name: LOG_LEVEL
    description: Application log level (debug|info|warn|error)
    value: "info"
  - name: DB_HOST
    description: PostgreSQL primary Service in this namespace
    required: true
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: app
  - name: DB_RUNTIME_SECRET
    required: true
  - name: DB_MIGRATION_SECRET
    required: true
  - name: DB_USERNAME_KEY
    value: username
  - name: DB_PASSWORD_KEY
    value: password
  - name: DB_SSLMODE
    description: disable for disposable PR databases; require for Patroni
    value: disable
  - name: DB_CLIENT
    description: Label used by the loc-tools Patroni ingress policy
    value: disposable
  - name: OIDC_ISSUER
    description: OIDC issuer URL used to validate access tokens
    required: true
  - name: OIDC_AUDIENCE
    description: Expected access token audience
    required: true
  - name: OIDC_JWKS_URI
    description: JWKS endpoint used to verify access token signatures
    required: true
  - name: OIDC_SUBMISSION_SCOPE
    description: Scope required to submit address change requests
    required: true
  - name: ENCRYPTION_KEY_ID
    description: ID of the active request encryption key
    required: true
  - name: APP_SECRET
    description: Pre-created Secret holding ADDRESS_CHANGE_ENCRYPTION_KEYS
    value: address-change-app
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
            database-client: ${DB_CLIENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          initContainers:
            - name: wait-for-db
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for database to be reachable..."
                  max_retries=30
                  attempt=1
                  until nc -z -v -w3 ${DB_HOST} ${DB_PORT}; do
                    if [ "$attempt" -ge "$max_retries" ]; then
                      echo "ERROR: Database ${DB_HOST}:${DB_PORT} is not reachable after ${max_retries} attempts." >&2
                      exit 1
                    fi
                    echo "Database not ready (attempt ${attempt}/${max_retries}), sleeping..."
                    attempt=$((attempt + 1))
                    sleep 2
                  done
                  echo "Database is UP!"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
            - name: migrations
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              imagePullPolicy: Always
              env:
                - name: POSTGRES_DATABASE
                  value: ${DB_NAME}
                - name: FLYWAY_URL
                  value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/$(POSTGRES_DATABASE)?sslmode=${DB_SSLMODE}
                - name: FLYWAY_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_MIGRATION_SECRET}
                      key: ${DB_USERNAME_KEY}
                - name: FLYWAY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_MIGRATION_SECRET}
                      key: ${DB_PASSWORD_KEY}
                - name: FLYWAY_DEFAULT_SCHEMA
                  value: "address_change"
              resources:
                requests:
                  cpu: 10m
                  memory: 50Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: POSTGRES_HOST
                  value: ${DB_HOST}
                - name: POSTGRES_PORT
                  value: "${DB_PORT}"
                - name: POSTGRES_DATABASE
                  value: ${DB_NAME}
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_RUNTIME_SECRET}
                      key: ${DB_USERNAME_KEY}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_RUNTIME_SECRET}
                      key: ${DB_PASSWORD_KEY}
                - name: POSTGRES_SSLMODE
                  value: ${DB_SSLMODE}
                - name: POSTGRES_SCHEMA
                  value: "address_change"
                - name: OIDC_ISSUER
                  value: ${OIDC_ISSUER}
                - name: OIDC_AUDIENCE
                  value: ${OIDC_AUDIENCE}
                - name: OIDC_JWKS_URI
                  value: ${OIDC_JWKS_URI}
                - name: OIDC_SUBMISSION_SCOPE
                  value: ${OIDC_SUBMISSION_SCOPE}
                - name: ADDRESS_CHANGE_ENCRYPTION_KEY_ID
                  value: ${ENCRYPTION_KEY_ID}
                - name: ADDRESS_CHANGE_ENCRYPTION_KEYS
                  valueFrom:
                    secretKeyRef:
                      name: ${APP_SECRET}
                      key: ADDRESS_CHANGE_ENCRYPTION_KEYS
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              startupProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /api
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    # distroless/nodejs has no /bin/sleep; exec hooks skip image ENTRYPOINT
                    command: ["/nodejs/bin/node", "-e", "setTimeout(() => {}, 10000)"]
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
