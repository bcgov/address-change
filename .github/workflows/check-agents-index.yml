# Validate .agents/INDEX.md paths and run regression tests for the project tooling.
name: Check Agents Index
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/check_index.py
