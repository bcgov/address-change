# =============================================================================
# Spectral Ruleset for address-change
# =============================================================================
# Extends the BC Government itk-api-governance strict and SDX rulesets.
#
# Guides:
#   https://developer.gov.bc.ca/docs/default/component/api-style-guides/basic-style-guide/
#   https://developer.gov.bc.ca/docs/default/component/api-style-guides/sdx-style-guide/
# Ruleset: https://github.com/bcgov/itk-api-governance/tree/main/dist/spectral
# =============================================================================

extends:
  - https://raw.githubusercontent.com/bcgov/itk-api-governance/main/dist/spectral/strict-ruleset.yaml
  - https://raw.githubusercontent.com/bcgov/itk-api-governance/main/dist/spectral/sdx-ruleset.yaml

rules:
  # ==========================================================================
  # SDX API Standard - Project-specific rules
  # ==========================================================================
  # These rules are NOT covered by the upstream sdx-ruleset.yaml.

  # SDX: OAD must use OpenAPI 3.x or newer. Swagger 2.0 is not supported.
  sdx-oas3-required:
    description: >-
      SDX requires OpenAPI 3.x or newer. Swagger 2.0 is not supported
      for SDX provisioning.
    message: "SDX requires OpenAPI 3.x. Swagger 2.0 is not supported."
    severity: error
    given: $
    then:
      field: openapi
      function: pattern
      functionOptions:
        match: ^3\.\d+\.\d+$

  # TODO: Restore the SDX OAuth2 checks and security-declaration guidance when
  # gateway OAuth2 flows, scopes, and operation security are implemented.
  # The current API contract must not claim authentication it does not provide.
  sdx-oauth2-security-schemes: off
  sdx-oauth2-scope-descriptions-consistent: off
  sdx-operation-security-scopes: off

overrides:
  # SDG supplies these snake_case names. Preserve the external payload contract;
  # camelCase validation remains enabled for every other schema.
  - files:
      - "../../../api/target/openapi.json#/components/schemas/SdgSubmissionData/properties"
      - "../../../docs/public/openapi.json#/components/schemas/SdgSubmissionData/properties"
    rules:
      schema-property-camel-case: off
