name: PR Validate

on:
  pull_request:
    types: [edited, opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-edit-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate Results
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails when docs/public/openapi/test.json is stale or breaks the BC Gov SDX Spectral rules.
  # The pre-commit hook normally regenerates it; manually: cd backend && npm run openapi
  openapi:
    name: OpenAPI Spec Valid
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-update-notifier
      - run: npm run openapi:check
      - name: Lint spec (SDX Spectral rules)
        working-directory: .
        run: npx --yes @stoplight/spectral-cli@6.14.0 lint docs/public/openapi/test.json --ruleset .spectral.yaml --fail-severity=hint
