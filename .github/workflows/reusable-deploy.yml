# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    secrets:
      db_password:
        description: Password for disposable PR databases only
        required: false
      oc_token:
        description: OpenShift token
        required: true
    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

      - name: Check Patroni prerequisites
        if: inputs.environment == 'test' || inputs.environment == 'prod'
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -euo pipefail
            oc get service address-change-db-patroni -o name
            for secret in address-change-db-runtime address-change-db-migration; do
              for key in username password; do
                value=$(oc get secret "$secret" -o "jsonpath={.data.$key}")
                if [ -z "$value" ]; then
                  echo "::error::$secret is missing $key; deploy loc-tools bootstrap first."
                  exit 1
                fi
                unset value
              done
            done

  database:
    name: Deploy disposable PR database
    if: inputs.environment != 'test' && inputs.environment != 'prod'
    needs: [init]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Hash migrations
        id: migrations
        run: |
          set -euo pipefail
          hash=$(find migrations/sql -type f -name '*.sql' | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Check disposable database password
        env:
          DB_PASSWORD: ${{ secrets.db_password }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::db_password is required for disposable PR databases."
            exit 1
          fi
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        env:
          DB_PASSWORD: ${{ secrets.db_password }}
        with:
          file: common/openshift.database-init.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Retain the password of an already initialized disposable database.
          overwrite: false
          parameters: -p DB_PASSWORD="$DB_PASSWORD"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
      # Flyway rejects edited or reordered migrations on an already-migrated
      # database. Disposable PR databases are rebuilt when the migrations change.
      - name: Reset disposable database if migrations changed
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -euo pipefail
            sts="${{ github.event.repository.name }}-${{ inputs.target }}-database"
            if [ -n "$(oc get statefulset "$sts" -o name --ignore-not-found)" ]; then
              current=$(oc get statefulset "$sts" -o jsonpath='{.metadata.annotations.migrations-hash}')
              if [ "$current" != "${{ steps.migrations.outputs.hash }}" ]; then
                echo "Migrations changed; recreating $sts and its volume."
                oc delete statefulset "$sts" --cascade=foreground --wait=true
                oc delete pvc "data-$sts-0" --ignore-not-found --wait=true --timeout=180s
              fi
            fi
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        with:
          file: common/openshift.database.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          parameters: -p DB_PVC_SIZE="256Mi"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
      - name: Record migrations hash
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            set -euo pipefail
            oc annotate statefulset "${{ github.event.repository.name }}-${{ inputs.target }}-database" \
              migrations-hash="${{ steps.migrations.outputs.hash }}" --overwrite

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init, database]
    # The database job is intentionally skipped for Patroni environments.
    if: ${{ !cancelled() && needs.init.result == 'success' && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            parameters: >-
              -p IMAGE_TAG="${{ inputs.tag }}"
              -p DB_HOST="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'address-change-db-patroni' || format('{0}-{1}-database', github.event.repository.name, inputs.target) }}"
              -p DB_NAME="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'address_change' || 'app' }}"
              -p DB_RUNTIME_SECRET="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'address-change-db-runtime' || format('{0}-{1}-database', github.event.repository.name, inputs.target) }}"
              -p DB_MIGRATION_SECRET="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'address-change-db-migration' || format('{0}-{1}-database', github.event.repository.name, inputs.target) }}"
              -p DB_USERNAME_KEY="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'username' || 'database-user' }}"
              -p DB_PASSWORD_KEY="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'password' || 'database-password' }}"
              -p DB_SSLMODE="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'require' || 'disable' }}"
              -p DB_CLIENT="${{ (inputs.environment == 'test' || inputs.environment == 'prod') && 'address-change' || 'disposable' }}"
              -p OIDC_ISSUER="${{ vars.OIDC_ISSUER }}"
              -p OIDC_AUDIENCE="${{ vars.OIDC_AUDIENCE }}"
              -p OIDC_JWKS_URI="${{ vars.OIDC_JWKS_URI }}"
              -p OIDC_SUBMISSION_SCOPE="${{ vars.OIDC_SUBMISSION_SCOPE }}"
              -p ENCRYPTION_KEY_ID="${{ vars.ENCRYPTION_KEY_ID }}"
          - name: frontend
            file: frontend/openshift.deploy.yml
            parameters: >-
              -p IMAGE_TAG="${{ inputs.tag }}"
              -p OIDC_AUTHORITY="${{ vars.OIDC_ISSUER }}"
              -p OIDC_CLIENT_ID="${{ vars.OIDC_AUDIENCE }}"
              -p OIDC_SCOPE="openid profile email ${{ vars.OIDC_SUBMISSION_SCOPE }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_login_attempts: 7
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}
