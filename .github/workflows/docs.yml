name: Deploy Pages Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose Prod spec to publish; latest release when empty
        type: string
        default: ""

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      # Always build the Test spec and its history from the default branch, even when called for a release tag
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci --ignore-scripts --no-update-notifier

      # Prod spec is the release asset. Only a confirmed absence of any release falls back to the
      # placeholder (created by the prebuild script); any other failure stops the build so the
      # published site is not overwritten.
      - name: Fetch Prod spec
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: .
        run: |
          mkdir -p docs/public/openapi
          set +e
          out=$(gh release download ${RELEASE_TAG:+"${RELEASE_TAG}"} --repo "${GITHUB_REPOSITORY}" --pattern openapi-prod.json --output docs/public/openapi/prod.json --clobber 2>&1)
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            if [ -z "${RELEASE_TAG}" ] && echo "${out}" | grep -qiE 'release not found|no assets match'; then
              echo "No released Prod spec found; the placeholder will be used."
            else
              echo "${out}"
              exit 1
            fi
          fi

      - run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to Pages
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
