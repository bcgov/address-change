name: Deploy Pages Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci --ignore-scripts --no-update-notifier

      # Prod spec is the latest release asset; use an empty placeholder before the first release
      - name: Fetch Prod spec
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          mkdir -p docs/public/openapi
          if ! gh release download --repo "${GITHUB_REPOSITORY}" --pattern openapi-prod.json --output docs/public/openapi/prod.json --clobber; then
            echo "No released Prod spec found; using placeholder."
            echo '{"openapi":"3.0.0","info":{"title":"Address Change API","version":"unreleased","description":"No production release has been published yet."},"paths":{}}' > docs/public/openapi/prod.json
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to Pages
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
