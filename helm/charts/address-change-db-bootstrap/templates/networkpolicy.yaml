{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "address-change-db-bootstrap.fullname" . }}-database-access
  labels:
    {{- include "address-change-db-bootstrap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.patroniPodSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "address-change-db-bootstrap.labels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.applicationPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
{{- end }}
