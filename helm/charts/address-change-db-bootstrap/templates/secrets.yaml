{{- if not .Values.vault.enabled }}
{{- $migrationSecretName := required "roles.migration.secretName is required" .Values.roles.migration.secretName -}}
{{- $migrationSecret := lookup "v1" "Secret" .Release.Namespace $migrationSecretName -}}
{{- $migrationPassword := randAlphaNum 48 -}}
{{- if and $migrationSecret (hasKey $migrationSecret.data "password") -}}
{{- $migrationPassword = (index $migrationSecret.data "password" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $migrationSecretName }}
  labels:
    {{- include "address-change-db-bootstrap.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "roles.migration.username is required" .Values.roles.migration.username | quote }}
  password: {{ $migrationPassword | quote }}
---
{{ $runtimeSecretName := required "roles.runtime.secretName is required" .Values.roles.runtime.secretName -}}
{{- $runtimeSecret := lookup "v1" "Secret" .Release.Namespace $runtimeSecretName -}}
{{- $runtimePassword := randAlphaNum 48 -}}
{{- if and $runtimeSecret (hasKey $runtimeSecret.data "password") -}}
{{- $runtimePassword = (index $runtimeSecret.data "password" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtimeSecretName }}
  labels:
    {{- include "address-change-db-bootstrap.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "roles.runtime.username is required" .Values.roles.runtime.username | quote }}
  password: {{ $runtimePassword | quote }}

{{- end }}
