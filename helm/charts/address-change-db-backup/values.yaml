vault:
  enabled: false
  namespace: platform-services
  authPath: auth/k8s-gold
  role: ""
  serviceAccountName: b5cfc6-vault
  databasePath: ""
  s3Path: ""

database:
  host: address-change-db-patroni
  port: 5432
  name: address_change
  sslMode: require

adminCredentials:
  secretName: address-change-db-patroni
  usernameKey: username-superuser
  passwordKey: password-superuser

# Provisioned by this chart; password is generated once and retained on upgrades.
backupRole:
  username: address_change_backup
  secretName: address-change-db-backup

provisioning:
  # Includes image pull/startup time as well as database reconciliation.
  activeDeadlineSeconds: 600
  image: postgres:18.6-alpine
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

networkPolicy:
  enabled: true
  patroniPodSelector:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/instance: address-change-db

# To switch to S3, set backup-storage.enabled=false and configure this block.
s3:
  endpoint: ""
  bucket: ""
  prefix: address_change_db_backups
  secretName: address-change-db-s3
  credentials:
    create: false
    accessKeyId: ""
    secretAccessKey: ""
  clientImage: public.ecr.aws/aws-cli/aws-cli:2.27.41@sha256:1c2d7a51b1ff4f460bc3f1e1ee46a6cef47c7429ad9089ef99012a95e472a1a5
  region: us-east-1
  stagingSize: 2Gi
  verificationSize: 2Gi

# Render a one-shot Job with --show-only templates/recovery-job.yaml.
recovery:
  enabled: false
  database: ""
  object: ""
  migrationRole: address_change_migration
  runtimeRole: address_change_runtime
  activeDeadlineSeconds: 3600

backup-storage:
  enabled: true
  fullnameOverride: address-change-db-backup
  podAnnotations:
    address-change.gov.bc.ca/backup-plugin-revision: address-change-schema-v2
  image:
    repository: ghcr.io/bcgov/backup-container
    tag: "2.13.1"
    pullPolicy: IfNotPresent
  # Internal cron, not a Kubernetes CronJob. flock also protects manual operations.
  # Upstream verifies the most recent backup; it does not verify every retained file.
  backupConfig: |
    postgres=address-change-db-patroni:5432/address_change?verifySchema=address_change

    0 3 * * * default env PGSSLMODE=require flock -n /backups/.operation.lock /bin/bash /backup.sh -s
    0 6 * * * default flock -n /backups/.operation.lock /bin/bash /backup.sh -s -v all
  # Adapted from bcgov/backup-container 2.13.1 docker/backup.postgres.plugin.
  # Local changes: roles first, address_change schema only, fail either dump pipeline.
  config:
    - filename: backup.postgres.plugin
      mountPath: /backup.postgres.plugin
      contents: |
        #!/bin/bash
        # =================================================================================================================
        # Postgres Backup and Restore Functions:
        # - Dynamically loaded as a plug-in
        # -----------------------------------------------------------------------------------------------------------------
        export serverDataDirectory="/var/lib/pgsql/data"

        # Filters pg_dumpall --roles-only output from stdin.
        # Removes CREATE/ALTER ROLE statements for:
        # - the database user role passed as arg1
        # - postgres
        # Handles both quoted and unquoted role names (for example: role and "role").
        # All other lines are passed through unchanged.
        function filterRoleDump(){
          local _targetRole=${1}

          awk -v targetRole="${_targetRole}" '
            {
              # Role name is the third token in both CREATE ROLE and ALTER ROLE statements.
              role = $3
              sub(/;$/, "", role)
              sub(/^"/, "", role)
              sub(/"$/, "", role)
            }

            ($1 == "CREATE" || $1 == "ALTER") && $2 == "ROLE" && (role == targetRole || role == "postgres") {
              next
            }

            { print }
          '
        }

        function onBackupDatabase(){
          (
            local OPTIND
            local unset flags
            while getopts : FLAG; do
              case $FLAG in
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}
            _backupFile=${2}

            _hostname=$(getHostname ${_databaseSpec})
            _database=$(getDatabaseName ${_databaseSpec})
            _port=$(getPort ${_databaseSpec})
            _portArg=${_port:+"-p ${_port}"}
            _username=$(getUsername ${_databaseSpec})
            _password=$(getPassword ${_databaseSpec})

            echoGreen "Backing up '${_hostname}${_port:+:${_port}}${_database:+/${_database}}' to '${_backupFile}' ..."

            export PGPASSWORD=${_password}

            # Roles must exist before schema/table ownership and grants are restored.
            # pipefail applies to BOTH pipelines, so failed dumps cannot look successful.
            set -o pipefail
            pg_dumpall -h "${_hostname}" ${_portArg} -U "${_username}" --roles-only --no-role-passwords | \
              filterRoleDump "${_username}" | gzip > "${_backupFile}"
            _rtnCd=${?}

            if (( ${_rtnCd} == 0 )); then
              pg_dump -Fp --schema=address_change --strict-names -h "${_hostname}" ${_portArg} -U "${_username}" "${_database}" | gzip >> "${_backupFile}"
              _rtnCd=${?}
            fi
            return ${_rtnCd}
          )
        }

        function onRestoreDatabase(){
          (
            local OPTIND
            local unset quiet
            local unset flags
            while getopts :q FLAG; do
              case $FLAG in
                q )
                  quiet=1
                  flags+="-${FLAG} "
                  ;;
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}
            _fileName=${2}
            _adminPassword=${3}

            _hostname=$(getHostname ${flags} ${_databaseSpec})
            _database=$(getDatabaseName ${_databaseSpec})
            _port=$(getPort ${flags} ${_databaseSpec})
            _portArg=${_port:+"-p ${_port}"}
            _username=$(getUsername ${_databaseSpec})
            _password=$(getPassword ${_databaseSpec})
            echo -e "Restoring '${_fileName}' to '${_hostname}${_port:+:${_port}}${_database:+/${_database}}' ...\n" >&2

            export PGPASSWORD=${_adminPassword}
            _stopOnErrors="-v ON_ERROR_STOP=1"
            if ignoreErrors; then
              _stopOnErrors="-v ON_ERROR_STOP=0"
            fi
            _rtnCd=0

            # Drop
            if (( ${_rtnCd} == 0 )); then
              psql -h "${_hostname}" ${_portArg} -ac "DROP DATABASE \"${_database}\";"
              _rtnCd=${?}
              echo
            fi

            # Create
            if (( ${_rtnCd} == 0 )); then
              psql -h "${_hostname}" ${_portArg} -ac "CREATE DATABASE \"${_database}\";"
              _rtnCd=${?}
              echo
            fi

            # Drop Patroni-specific schemas
            if (( ${_rtnCd} == 0 )); then
              psql -h "${_hostname}" ${_portArg} -a -d ${_database} <<EOF
        DROP SCHEMA IF EXISTS metric_helpers CASCADE;
        DROP SCHEMA IF EXISTS user_management CASCADE;
        EOF

              _rtnCd=${?}
              echo
            fi

            # Grant User Access
            if (( ${_rtnCd} == 0 )); then
              psql -h "${_hostname}" ${_portArg} -ac "GRANT ALL ON DATABASE \"${_database}\" TO \"${_username}\";"
              _rtnCd=${?}
              echo
            fi

            # Restore
            if (( ${_rtnCd} == 0 )); then
              gunzip -c "${_fileName}" | psql ${_stopOnErrors} -x -h "${_hostname}" ${_portArg} -d "${_database}"
              # Get the status code from psql specifically.  ${?} would only provide the status of the last command, psql in this case.
              _rtnCd=${PIPESTATUS[1]}
            fi

            # List tables
            if [ -z "${quiet}" ] && (( ${_rtnCd} == 0 )); then
              psql -h "${_hostname}" ${_portArg} -d "${_database}" -c "\d"
              _rtnCd=${?}
            fi

            return ${_rtnCd}
          )
        }

        function onStartServer(){
          (
            local OPTIND
            local unset flags
            while getopts : FLAG; do
              case $FLAG in
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}

            # Start a local PostgreSql instance
            POSTGRESQL_DATABASE=$(getDatabaseName "${_databaseSpec}") \
            POSTGRESQL_USER=$(getUsername "${_databaseSpec}") \
            POSTGRESQL_PASSWORD=$(getPassword "${_databaseSpec}") \
            run-postgresql >/dev/null 2>&1 &
          )
        }

        function onStopServer(){
          (
            local OPTIND
            local unset flags
            while getopts : FLAG; do
              case $FLAG in
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}

            # Stop the local PostgreSql instance
            pg_ctl stop -D ${serverDataDirectory}/userdata
          )
        }

        function onCleanup(){
          (
            if ! dirIsEmpty ${serverDataDirectory}; then
              # Delete the database files and configuration
              echo -e "Cleaning up ...\n" >&2
              rm -rf ${serverDataDirectory}/*
            else
              echo -e "Already clean ...\n" >&2
            fi
          )
        }

        function onPingDbServer(){
          (
            local OPTIND
            local unset flags
            while getopts : FLAG; do
              case $FLAG in
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}

            _hostname=$(getHostname ${flags} ${_databaseSpec})
            _database=$(getDatabaseName ${_databaseSpec})
            _port=$(getPort ${flags} ${_databaseSpec})
            _portArg=${_port:+"-p ${_port}"}
            _username=$(getUsername ${_databaseSpec})
            _password=$(getPassword ${_databaseSpec})

            if PGPASSWORD=${_password} psql -h ${_hostname} ${_portArg} -U ${_username} -q -d ${_database} -c 'SELECT 1' >/dev/null 2>&1; then
              return 0
            else
              return 1
            fi
          )
        }

        function onVerifyBackup(){
          (
            local OPTIND
            local unset flags
            while getopts : FLAG; do
              case $FLAG in
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}

            _hostname=$(getHostname -l ${_databaseSpec})
            _database=$(getDatabaseName ${_databaseSpec})
            _schema=$(getSchema ${_databaseSpec} 'verify')
            _port=$(getPort -l ${_databaseSpec})
            _portArg=${_port:+"-p ${_port}"}
            _username=$(getUsername ${_databaseSpec})
            _password=$(getPassword ${_databaseSpec})

            debugMsg "backup.postgres.plugin - onVerifyBackup"
            tables=$(psql -h "${_hostname}" ${_portArg} -d "${_database}" -t -c "SELECT table_name FROM information_schema.tables WHERE table_schema='${_schema}' AND table_type='BASE TABLE';")
            rtnCd=${?}

            # Get the size of the restored database
            if (( ${rtnCd} == 0 )); then
              size=$(getDbSize -l "${_databaseSpec}")
              rtnCd=${?}
            fi

            if (( ${rtnCd} == 0 )); then
              numResults=$(echo "${tables}"| wc -l)
              if [[ ! -z "${tables}" ]] && (( numResults >= 1 )); then
                # All good
                verificationLog="\nThe restored database contained ${numResults} tables, and is ${size} in size."
              else
                # Not so good
                verificationLog="\nNo tables were found in the restored database."
                rtnCd="3"
              fi
            fi

            echo ${verificationLog}
            return ${rtnCd}
          )
        }

        function onGetDbSize(){
          (
            local OPTIND
            local unset flags
            while getopts : FLAG; do
              case $FLAG in
                ? ) flags+="-${OPTARG} ";;
              esac
            done
            shift $((OPTIND-1))

            _databaseSpec=${1}

            _hostname=$(getHostname ${flags} ${_databaseSpec})
            _database=$(getDatabaseName ${_databaseSpec})
            _port=$(getPort ${flags} ${_databaseSpec})
            _portArg=${_port:+"-p ${_port}"}
            _username=$(getUsername ${_databaseSpec})
            _password=$(getPassword ${_databaseSpec})

            size=$(PGPASSWORD=${_password} psql -h "${_hostname}" ${_portArg} -U "${_username}" -d "${_database}" -t -c "SELECT pg_size_pretty(pg_database_size(current_database())) as size;")
            rtnCd=${?}

            echo ${size}
            return ${rtnCd}
          )
        }
        # =================================================================================================================

  db:
    enabled: true
    secretName: address-change-db-backup
    usernameKey: username
    passwordKey: password
  env:
    TZ: {value: America/Vancouver}
    BACKUP_STRATEGY: {value: rolling}
    BACKUP_DIR: {value: /backups/}
    BACKUP_CONF: {value: /conf/backup.conf}
    DAILY_BACKUPS: {value: "14"}
    WEEKLY_BACKUPS: {value: "8"}
    MONTHLY_BACKUPS: {value: "3"}
    ENVIRONMENT_NAME: {value: DEV}
    ENVIRONMENT_FRIENDLY_NAME: {value: Address Change DEV database backups}
    # Verification starts a local server that may not support TLS. Remote dumps
    # above explicitly require TLS; verification uses the upstream connection defaults.
    PGSSLMODE: {value: prefer}
  persistence:
    backup:
      size: 5Gi
      mountPath: /backups/
      storageClassName: netapp-file-backup
      storageAccessMode: ReadWriteOnce
    verification:
      size: 2Gi
      mountPath: /var/lib/pgsql/data
      storageClassName: netapp-file-standard
      storageAccessMode: ReadWriteOnce
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  podSecurityContext:
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  # Parent policy uses our actual Patroni labels, not upstream's backup=true label.
  networkPolicy: {enabled: false}
