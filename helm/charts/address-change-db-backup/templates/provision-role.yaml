{{- $vault := dict "secrets" (list) -}}
{{- if .Values.vault.enabled -}}
{{- $vault = include "ac-db.provision.vault" . | fromJson -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-provision-role
  labels:
    {{- include "ac-backup.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.provisioning.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      {{- if .Values.vault.enabled }}
      annotations:
        {{- include "ac-db.vault.annotations" (merge (dict "root" .) $vault) | nindent 8 }}
        {{- include "ac-db.vault.tokenAnnotation" . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ac-backup.labels" . | nindent 8 }}
    spec:
      {{- if .Values.vault.enabled }}
      serviceAccountName: {{ .Values.vault.serviceAccountName }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision-backup-role
          image: {{ .Values.provisioning.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          command: [/bin/sh, -ec]
          args:
            - |
              {{- if .Values.vault.enabled }}
              {{- include "ac-db.vault.load" $vault | nindent 14 }}
              {{- end }}
              psql --dbname=postgres --set=ON_ERROR_STOP=1 \
                --set=backup_user="$BACKUP_USER" \
                --set=backup_password="$BACKUP_PASSWORD" \
                --set=database_name="$DATABASE_NAME" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
                :'backup_user', :'backup_password') WHERE NOT EXISTS (
                  SELECT FROM pg_roles WHERE rolname = :'backup_user'
                ) \gexec
              SELECT format('ALTER ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
                :'backup_user', :'backup_password') \gexec
              SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'database_name', :'backup_user') \gexec
              SELECT format('GRANT pg_read_all_data TO %I', :'backup_user') \gexec
              SQL
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGSSLMODE
              value: {{ .Values.database.sslMode | quote }}
            {{- if not .Values.vault.enabled }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminCredentials.secretName | quote }}
                  key: {{ .Values.adminCredentials.usernameKey | quote }}
            {{- end }}
            {{- if not .Values.vault.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminCredentials.secretName | quote }}
                  key: {{ .Values.adminCredentials.passwordKey | quote }}
            {{- end }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            {{- if not .Values.vault.enabled }}
            - name: BACKUP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backupRole.secretName | quote }}
                  key: username
            {{- end }}
            {{- if not .Values.vault.enabled }}
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backupRole.secretName | quote }}
                  key: password
            {{- end }}
          resources:
            {{- toYaml .Values.provisioning.resources | nindent 12 }}
      {{- if .Values.vault.enabled }}
      volumes:
        {{- include "ac-db.vault.tokenVolume" . | nindent 8 }}
      {{- end }}
