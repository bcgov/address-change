{{- if not .Values.vault.enabled }}
{{- if and (not (index .Values "backup-storage").enabled) .Values.s3.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "s3.secretName is required" .Values.s3.secretName | quote }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "s3.credentials.accessKeyId is required when creating the S3 Secret" .Values.s3.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "s3.credentials.secretAccessKey is required when creating the S3 Secret" .Values.s3.credentials.secretAccessKey | quote }}
{{- end }}

{{- end }}
