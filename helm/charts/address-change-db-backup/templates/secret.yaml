{{- if not .Values.vault.enabled }}
{{- $name := required "backupRole.secretName is required" .Values.backupRole.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 48 -}}
{{- if and $existing (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "ac-backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "backupRole.username is required" .Values.backupRole.username | quote }}
  password: {{ $password | quote }}

{{- end }}
