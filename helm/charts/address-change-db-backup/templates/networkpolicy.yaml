{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database-access
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.patroniPodSelector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ ternary "backup-storage" "address-change-db-backup-s3" (index .Values "backup-storage").enabled }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              {{- include "ac-backup.labels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
{{- end }}
